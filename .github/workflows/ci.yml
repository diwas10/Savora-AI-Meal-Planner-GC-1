name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python:
    name: Python (ruff, pyright, pytest, architecture boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Verify AI boundary isolation (no backend/ORM/HTTP imports in ai_system)
        run: |
          if grep -rnE "^\s*(from|import)\s+(savora_backend|fastapi|sqlalchemy)" apps/ai_system/src/; then
            echo "::error::apps/ai_system must not import savora_backend, fastapi, or sqlalchemy (see AGENTS.md)."
            exit 1
          fi
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Typecheck with Pyright
        run: uv run pyright
      - name: Run pytest
        run: uv run pytest -q
      - name: Verify OpenAPI contract export
        run: make contracts

  frontend:
    name: Frontend (eslint, tsc, next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify frontend layer isolation (no direct axios in src/app)
        run: |
          if grep -rnE "from ['\"]axios['\"]" apps/frontend/src/app/; then
            echo "::error::Direct axios imports in apps/frontend/src/app/ are forbidden. Use .api.ts -> .query.ts -> component."
            exit 1
          fi
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
