[project]
name = "savora"
version = "0.1.0"
description = "Savora monorepo (uv workspace root; not published)"
requires-python = ">=3.12"
dependencies = ["savora-backend", "savora-ai"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["apps/backend", "apps/ai_system"]

[tool.uv.sources]
savora-backend = { workspace = true }
savora-ai = { workspace = true }

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["savora_backend", "savora_ai"]

[tool.ruff.lint.per-file-ignores]
"**/alembic/env.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["apps/backend/src", "apps/backend/tests", "apps/backend/alembic", "apps/ai_system/src", "apps/ai_system/tests"]
exclude = ["**/node_modules", "**/__pycache__", "apps/backend/alembic/versions"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["apps/backend/tests", "apps/ai_system/tests"]
