[project]
name = "savora-backend"
version = "0.1.0"
description = "Savora FastAPI backend: HTTP, auth, persistence, orchestration."
requires-python = ">=3.12"
dependencies = [
  "savora-ai",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2.1",
]

[tool.uv.sources]
savora-ai = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
